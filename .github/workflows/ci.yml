name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Backend Job ────────────────────────────────────────────────────────────
  backend:
    name: Backend Tests & Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dast
          POSTGRES_PASSWORD: dast_secret
          POSTGRES_DB: dast_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://dast:dast_secret@localhost:5432/dast_db
      DATABASE_URL_SYNC: postgresql://dast:dast_secret@localhost:5432/dast_db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-32-chars-minimum-safe-1234
      DEBUG: "true"
      ENVIRONMENT: testing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic database migrations
        working-directory: backend
        run: |
          alembic upgrade head

      - name: Run Pytest test suite
        working-directory: backend
        run: |
          pytest

  # ─── Frontend Job ───────────────────────────────────────────────────────────
  frontend:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run TypeScript type check
        working-directory: frontend
        run: npm run test:typecheck

      - name: Run Unit Tests
        working-directory: frontend
        run: npm run test

      - name: Build Next.js Application
        working-directory: frontend
        env:
          BACKEND_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000
          NODE_ENV: production
        run: npm run build
